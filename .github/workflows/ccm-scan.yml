name: CCM Continuous Compliance Scan

on:
  push:
    branches: [main, baker-*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run pytest
        run: |
          pytest -v --tb=short --cov=ccm --cov-report=term-missing
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .coverage

  scan:
    name: Control Compliance Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install CCM
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run fixture scan
        run: |
          ccm scan --output html --output-file ccm-report.html
        continue-on-error: true
      
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccm-report
          path: ccm-report.html
      
      - name: Export evidence
        if: always()
        run: |
          ccm export-evidence-cmd --output evidence.json
      
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence.json
